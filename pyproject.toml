[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadanomaly"
version = "0.1.0"
description = "Shared data pipeline, metrics and GPU setup for the RoadAnomaly Deep Learning project (ESPRIT)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
