[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadanomaly"
version = "0.1.0"
description = "Shared code of the RoadAnomaly CRISP-DM project (ESPRIT): data, protocol, models, evaluation, inference, XAI"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
markers = ["slow: regenerates the split from the raw data (about 20 s)"]
filterwarnings = ["ignore::DeprecationWarning"]

# Editor type checking (Pylance / pyright). TensorFlow, Keras and NumPy are only partly typed, so "strict"
# would flag almost every line of working code; "basic" keeps real mistakes (undefined names, wrong calls).
[tool.pyright]
include = ["src", "deployment", "scripts", "tests"]
extraPaths = ["src"]
typeCheckingMode = "basic"
reportMissingModuleSource = false
# Notebooks may define a helper again in a later phase (the master notebook joins the phases): allowed there only
executionEnvironments = [{ root = "notebooks", reportRedeclaration = false }]
# These rules mostly flag working TensorFlow / Keras / NumPy / pandas code (Optional returns, partial stubs):
reportAttributeAccessIssue = false
reportArgumentType = false
reportGeneralTypeIssues = false
reportOperatorIssue = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportOptionalOperand = false
reportCallIssue = false

# Code quality: `mise run lint` (ruff, pinned in requirements.txt). Same rules in VS Code with the Ruff extension.
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "."]
extend-exclude = ["archive", "deployment/landing/node_modules"]

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, simplify, pyupgrade, import order, naming, comprehensions, misc, returns
select = ["E", "W", "F", "B", "SIM", "UP", "I", "N", "C4", "PIE", "RET"]

[tool.ruff.lint.per-file-ignores]
# Notebooks import in their setup cell, after setting TensorFlow's log level in os.environ
"*.ipynb" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters with calls in default arguments; that is its documented style
extend-immutable-calls = ["fastapi.File", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["roadanomaly", "deployment", "scripts"]

