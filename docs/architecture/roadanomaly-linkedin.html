  <title id="roadanomaly-architecture-title">RoadAnomaly: from 60 road photos to a product</title>
  <desc id="roadanomaly-architecture-desc">Architecture of the RoadAnomaly project: a 60-photo dataset trains six models whose saved artifacts are loaded by one shared Predictor, which serves the evaluation and explanations, a FastAPI service, the client product and a technical demo, while a static landing page reads the test results.</desc>
