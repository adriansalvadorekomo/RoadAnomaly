name: CI

# Fast, deterministic gates. No secrets and no GPU are required, so every
# fork and every pull request runs the same checks the main branch does.
#
# Jobs that depend on code which does not exist yet (frontend, Docker images)
# are gated on the relevant files being present. They activate automatically
# as those files land instead of failing on an empty repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `hashFiles()` is only available inside a step, not in a job-level `if:`.
  # Calling it there makes the whole workflow invalid ("Unrecognized
  # function"), so detect the optional components once and gate on outputs.
  changes:
    name: Detect optional components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      containers: ${{ steps.detect.outputs.containers }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        name: Check for optional files
        run: |
          echo "frontend=$(test -f frontend/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "containers=$(test -f infra/docker/Dockerfile.backend && test -f infra/docker/Dockerfile.frontend && echo true || echo false)" >> "$GITHUB_OUTPUT"

  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy dl backend tests

      - name: Dataset integrity tests
        run: pytest -q

      - name: Coverage report (non-blocking until models land)
        run: |
          python -m pytest --cov --cov-report=term-missing --cov-fail-under=0
        continue-on-error: true

  frontend:
    name: Dashboard build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Type check
        working-directory: frontend
        run: npx --yes tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  containers:
    name: Container build
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: false
          tags: roadanomaly-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: infra/docker/Dockerfile.frontend
          push: false
          tags: roadanomaly-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
