name: CI

# Fast, deterministic gates. No secrets and no GPU are required, so every
# fork and every pull request runs the same checks the main branch does.
#
# Jobs that depend on code which does not exist yet (landing page, prototype,
# Docker images, ML smoke test) are gated on the relevant files being present.
# They activate automatically as those files land instead of failing on an
# empty repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `hashFiles()` is only available inside a step, not in a job-level `if:`.
  # Calling it there makes the whole workflow invalid ("Unrecognized
  # function"), so detect the optional components once and gate on outputs.
  changes:
    name: Detect optional components
    runs-on: ubuntu-latest
    outputs:
      landing: ${{ steps.detect.outputs.landing }}
      prototype: ${{ steps.detect.outputs.prototype }}
      containers: ${{ steps.detect.outputs.containers }}
      ml: ${{ steps.detect.outputs.ml }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        name: Check for optional files
        run: |
          echo "landing=$(test -f frontend/landing/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "prototype=$(test -f frontend/prototype/app.py && test -f requirements/prototype.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "containers=$(test -f infra/docker/Dockerfile.backend && test -f infra/docker/Dockerfile.prototype && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ml=$(test -f dl/training/train.py && test -f configs/smoke.yaml && echo true || echo false)" >> "$GITHUB_OUTPUT"

  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy dl backend tests

      - name: Architecture contract tests
        run: pytest -q tests/architecture -v

      - name: Dataset and full contract tests
        run: pytest -q

      - name: Coverage report (non-blocking until models land)
        run: |
          python -m pytest --cov --cov-report=term-missing --cov-fail-under=0
        continue-on-error: true

  ml-smoke:
    name: TensorFlow smoke test
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install TensorFlow training dependencies
        run: pip install -r requirements/dl.txt

      - name: Train two steps on a two-image subset
        run: |
          python -m dl.training.train \
            --config configs/smoke.yaml \
            --limit-images 2 \
            --max-steps 2 \
            --output-dir artifacts/smoke

  landing:
    name: Astro landing build
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/landing/package-lock.json

      - name: Install
        working-directory: frontend/landing
        run: npm ci

      - name: Lint
        working-directory: frontend/landing
        run: npm run lint --if-present

      - name: Build
        working-directory: frontend/landing
        run: npm run build

  prototype:
    name: Streamlit prototype check
    needs: changes
    if: needs.changes.outputs.prototype == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install prototype dependencies
        run: pip install -r requirements/prototype.txt

      - name: Syntax check
        run: python -m compileall -q frontend/prototype

  containers:
    name: Container build
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: false
          tags: roadanomaly-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build prototype image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.prototype
          push: false
          tags: roadanomaly-prototype:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
