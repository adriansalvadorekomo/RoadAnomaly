name: CD

# Runs on version tags: v1.0.0, v0.2.1, ...
# Publishes immutable container images, re-runs the training smoke test, and
# deploys the technical report to GitHub Pages.
#
# Nothing here runs on a pull request. The only trigger is a tag, so a bad tag
# is the only thing that can deploy — and tags are created deliberately.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # `hashFiles()` is only available inside a step, not in a job-level `if:`.
  # Detect the optional artefacts once and gate the jobs on these outputs.
  changes:
    name: Detect deployable components
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
      smoke: ${{ steps.detect.outputs.smoke }}
      report: ${{ steps.detect.outputs.report }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        name: Check for optional files
        run: |
          echo "images=$(test -f infra/docker/Dockerfile.backend && test -f infra/docker/Dockerfile.frontend && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "smoke=$(test -f dl/training/train.py && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "report=$(test -f docs/report/_quarto.yml && echo true || echo false)" >> "$GITHUB_OUTPUT"

  images:
    name: Publish images to GHCR
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: infra/docker/Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment summary
        run: |
          {
            echo "### Images published for \`${{ github.ref_name }}\`"
            echo
            echo "| Image | Tag |"
            echo "|---|---|"
            echo "| \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api\` | \`${{ github.ref_name }}\` |"
            echo "| \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web\` | \`${{ github.ref_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-train:
    name: Training smoke test
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install CPU-only deep-learning dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Train two steps on a two-image subset
        run: |
          python -m dl.training.train \
            --config configs/smoke.yaml \
            --limit-images 2 \
            --max-steps 2 \
            --output-dir artifacts/smoke

      - name: Upload smoke artefacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: artifacts/smoke
          retention-days: 7

  report:
    name: Publish technical report
    needs: changes
    if: needs.changes.outputs.report == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        run: quarto render docs/report

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/report/_site

      - id: deployment
        uses: actions/deploy-pages@v4
